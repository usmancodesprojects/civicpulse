name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check app tests && mypy app
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck
        working-directory: frontend

  test-backend:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: pytest
        working-directory: backend
      - run: python ../scripts/check_frontend_contract.py
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          load: true
          tags: civicpulse-${{ matrix.component }}:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: civicpulse-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check submission readiness
        run: python scripts/check_submission.py
      - uses: azure/setup-kubectl@v4
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Render and validate manifests
        run: kubectl kustomize k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start application
        run: docker compose up -d --build frontend backend postgres redis
      - name: End-to-end assertions
        run: |
          for i in {1..40}; do curl -fsS http://localhost:8080/ready && break; sleep 3; done
          response=$(curl -fsS -X POST http://localhost:8080/api/complaints -H 'Content-Type: application/json' -d '{"text":"Live electric wire is sparking near the school","location":"School Road"}')
          id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$response")
          test "$(python -c 'import json,sys; print(json.load(sys.stdin)["category"])' <<< "$response")" = electricity
          curl -fsS "http://localhost:8080/api/complaints/$id" >/dev/null
          test "$(curl -sD - -o /dev/null http://localhost:8080/api/stats | tr -d '\r' | awk 'tolower($1)=="x-cache:" {print $2}')" = MISS
          test "$(curl -sD - -o /dev/null http://localhost:8080/api/stats | tr -d '\r' | awk 'tolower($1)=="x-cache:" {print $2}')" = HIT
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

