name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" && pytest
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          TRIAGE_PROVIDER: simulated
      - run: python ../scripts/check_frontend_contract.py
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  release:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push semantic tags
        run: |
          docker buildx build --push -t ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.ref_name }} ./backend
          docker buildx build --push -t ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.ref_name }} ./frontend
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

