apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: civicpulse-config
    patch: |-
      - op: replace
        path: /data/TRIAGE_PROVIDER
        value: llm
  - target:
      kind: Secret
      name: civicpulse-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: civicpulse-secrets
images:
  - name: ghcr.io/your-github-user/civicpulse-backend
    newName: ghcr.io/REPLACE_OWNER/civicpulse-backend
    newTag: REPLACE_WITH_COMMIT_SHA
  - name: ghcr.io/your-github-user/civicpulse-frontend
    newName: ghcr.io/REPLACE_OWNER/civicpulse-frontend
    newTag: REPLACE_WITH_COMMIT_SHA

